syntax = "proto3";
package linkchat;
import "base.proto";

option cc_generic_services = true;

message GetSingleFileReq {
    string file_id = 1;
    string token = 2;
}
message GetSingleFileRsp {
    bool success = 1;
    string errmsg = 2; 
    optional FileDownloadData file_data = 3;
}

message PutSingleFileReq { 
    string token = 1;
    FileUploadData file_data = 2;
}
message PutSingleFileRsp {
    bool success = 1;
    string errmsg = 2;
    FileMessageInfo file_info = 3; 
}

// 文件服务接口，客户端不直接调用这个接口，由各个需要的服务调用 
service FileService {
    // 下载单个文件
    rpc GetSingleFile(GetSingleFileReq) returns (GetSingleFileRsp); //下载单个文件 file_id 表示
    // 上传单个文件
    rpc PutSingleFile(PutSingleFileReq) returns (PutSingleFileRsp); //上传单个文件，会返回包括 file_id 在内的文件信息
}